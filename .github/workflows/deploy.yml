# EC2 준비 전에는 자동 배포를 실행하지 않는다. 서버 준비 후 main push 트리거를 복원한다.
# 필요한 GitHub Secrets: EC2_HOST, EC2_USER(보통 ubuntu), EC2_SSH_KEY(개인키 전체 내용)
name: Deploy to EC2

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/HiscAIHub
            bash deploy/deploy.sh
